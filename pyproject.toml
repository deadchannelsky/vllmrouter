[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-proxy"
version = "0.1.0"
description = "OpenAI-compatible proxy in front of one or more VLLM subprocess instances"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "anyio>=4.3.0",
]

[project.scripts]
vllm-proxy = "vllm_proxy.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_proxy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
